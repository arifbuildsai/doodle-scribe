<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TITLE HERE — Whiteboard Explainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #101215; color: #e8e6e0; font-family: "Kalam", cursive; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #cv { background: #dfe4e3; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.55); }
  #bar { display: flex; gap: 10px; align-items: center; padding: 9px 14px; background: #1a1d21; border-top: 1px solid #2a2e34; flex-wrap: wrap; }
  #bar button, #bar label.btn { background: #2a2e35; color: #e8e6e0; border: 1px solid #3a3f47; border-radius: 7px; padding: 6px 12px; font-family: "Kalam", cursive; font-size: 15px; cursor: pointer; user-select: none; }
  #bar button:hover, #bar label.btn:hover { background: #343a42; }
  #scrub { flex: 1; min-width: 160px; accent-color: #ffd75e; }
  #time { font-size: 14px; color: #a9adb6; min-width: 118px; text-align: center; }
  #vo { font-size: 13.5px; color: #8fbf7f; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #9aa0ab; background: rgba(26,29,33,.85); border: 1px solid #2a2e34; padding: 5px 14px; border-radius: 8px; pointer-events: none; transition: opacity .4s; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,12,14,.75); font-family: "Permanent Marker", cursive; font-size: 34px; color: #ffd75e; pointer-events: none; }
  body.drag #drop { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="31.6" step="0.01" value="0">
    <span id="time">0:00.0 / 0:31.6</span>
    <button id="snd">🔊 sound on</button>
    <label class="btn"><input id="loop" type="checkbox" checked> loop</label>
    <input id="file" type="file" accept="audio/*" hidden>
    <button id="load">⬆ Load voiceover</button>
    <span id="vo">no voiceover — own clock</span>
  </div>
</div>
<div id="hint">Load a voiceover file (button or drop it here) and the audio becomes the clock.</div>
<div id="drop">drop the audio file anywhere</div>

<script>

// ================= H helper library (unchanged) =================
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };
  H.layer = (W, H_) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
})();

// ================= whiteboard drawing technique (copied from the reference) =================
(function () {
  const seg = (pts, step = 2.5) => {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
      for (let j = 0; j < n; j++) out.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]);
    }
    out.push(pts[pts.length - 1]);
    return out;
  };
  const normals = (P) => P.map((p, i) => {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    return [-dy / d, dx / d];
  });
  const wobble = (pts, nz, seed, amp = 1.6, freq = 0.011) => {
    const N = normals(pts); let L = 0;
    return pts.map((p, i) => {
      if (i) L += Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1]);
      const o = nz.n2(L * freq + seed * 1.37, seed * 0.71) * amp + nz.n2(L * freq * 6 + seed, seed + 3.3) * amp * 0.25;
      return [p[0] + N[i][0] * o, p[1] + N[i][1] * o];
    });
  };
  const ell = (cx, cy, rx, ry, a0 = 0, a1 = Math.PI * 2, grow = 0) => {
    const n = Math.max(10, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 2.5)), out = [];
    for (let i = 0; i <= n; i++) {
      const u = i / n, a = a0 + (a1 - a0) * u, g = 1 + grow * u;
      out.push([cx + Math.cos(a) * rx * g, cy + Math.sin(a) * ry * g]);
    }
    return out;
  };
  const bez = (p0, p1, p2, p3) => {
    const out = [];
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, m = 1 - t;
      out.push([m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0],
        m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1]]);
    }
    return out;
  };
  const tracePath = (ctx, P) => { ctx.beginPath(); P.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); };

  const BOARD = [236, 240, 239];
  const MN = H.makeNoise(4242);

  const marker = (ctx, pts, col, w, seed, prog = 1) => {
    if (prog <= 0) return;
    const P = prog < 1 ? pts.slice(0, Math.max(2, Math.ceil(pts.length * prog))) : pts;
    const r = H.rng(seed), rgb = H.hex(col), N = normals(P);
    ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = H.rgba(rgb, 0.3); ctx.lineWidth = w; tracePath(ctx, P); ctx.stroke();
    ctx.lineCap = 'butt';
    const CH = 10;
    for (let i = 0; i < P.length - 1; i += CH) {
      const a = 0.16 + 0.22 * (0.5 + 0.5 * MN.n2(i * 0.03 + seed * 3.1, seed * 0.37));
      ctx.strokeStyle = H.rgba(rgb, a); ctx.lineWidth = w * 0.96;
      ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]);
      for (let j = i + 1; j <= Math.min(P.length - 1, i + CH); j++) ctx.lineTo(P[j][0], P[j][1]);
      ctx.stroke();
    }
    const n = 7;
    for (let k = 0; k < n; k++) {
      const u = k / (n - 1) - 0.5, edge = Math.abs(u) * 2;
      const a = (0.08 + 0.5 * Math.pow(edge, 2.2)) * (0.65 + r() * 0.7);
      ctx.strokeStyle = H.rgba(rgb, a); ctx.lineWidth = (w / n) * 1.5;
      const off = u * w * 0.84;
      ctx.beginPath();
      P.forEach((p, i) => { const x = p[0] + N[i][0] * off, y = p[1] + N[i][1] * off; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.stroke();
    }
    for (let k = 0; k < 4; k++) {
      const off = (r() - 0.5) * w * 0.6;
      ctx.strokeStyle = H.rgba(BOARD, 0.14 + r() * 0.2); ctx.lineWidth = 0.6 + r() * 0.6;
      const s = Math.floor(r() * P.length * 0.4), e = Math.min(P.length, s + Math.floor(P.length * (0.3 + r() * 0.6)));
      ctx.beginPath();
      for (let i = s; i < e; i++) { const x = P[i][0] + N[i][0] * off, y = P[i][1] + N[i][1] * off; i > s ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }
    [P[0], prog >= 1 ? P[P.length - 1] : null].forEach((p, j) => {
      if (!p) return;
      const g = ctx.createRadialGradient(p[0], p[1], 0, p[0], p[1], w * 0.62);
      g.addColorStop(0, H.rgba(rgb, j ? 0.25 : 0.42)); g.addColorStop(1, H.rgba(rgb, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p[0], p[1], w * 0.62, 0, 7); ctx.fill();
    });
    ctx.restore();
  };

  const mText = (ctx, str, x, y, font, col, seed, prog = 1, rot = 0) => {
    if (prog <= 0) return;
    const r = H.rng(seed), rgb = H.hex(col);
    ctx.save(); ctx.font = font; ctx.textBaseline = 'alphabetic';
    ctx.translate(x, y); ctx.rotate(rot);
    const nChars = Math.ceil(str.length * prog);
    let cx = 0;
    for (let i = 0; i < nChars; i++) {
      const ch = str[i], wch = ctx.measureText(ch).width;
      ctx.save(); ctx.translate(cx + wch / 2, (r() - 0.5) * 3); ctx.rotate((r() - 0.5) * 0.07);
      ctx.fillStyle = H.rgba(rgb, 0.8 + r() * 0.1); ctx.fillText(ch, -wch / 2, 0);
      ctx.strokeStyle = H.rgba(rgb, 0.7); ctx.lineWidth = 1.3; ctx.strokeText(ch, -wch / 2, 0);
      ctx.restore();
      cx += wch + (r() - 0.5) * 1.5;
    }
    ctx.restore();
  };

  // ---- XE-lite: timing / camera / shape helpers (from the reference engine) ----
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const win = (t, a, b) => clamp((t - a) / (b - a));
  const eio = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const camAt = (keys, t) => {
    if (t <= keys[0][0]) return keys[0].slice(1);
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t <= b[0]) {
        const u = eio((t - a[0]) / Math.max(1e-6, b[0] - a[0]));
        return [a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u, Math.exp(Math.log(a[3]) + (Math.log(b[3]) - Math.log(a[3])) * u)];
      }
    }
    return keys[keys.length - 1].slice(1);
  };
  const circ = (x, y, rx, ry, a0 = 0, a1 = Math.PI * 2, n = 0) => {
    n = n || Math.max(12, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 6)); const o = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
    return o;
  };
  const cubic = (p0, p1, p2, p3, n = 40) => { const o = []; for (let i = 0; i <= n; i++) { const t = i / n, m = 1 - t; o.push([m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0], m * m * m * p0[1] + 3 * m * m * t * p1[1] + 3 * m * t * t * p2[1] + t * t * t * p3[1]]); } return o; };
  const rrect = (x, y, w, h, r) => {
    const o = [[x + r, y], [x + w - r, y]]; o.push(...circ(x + w - r, y + r, r, r, -Math.PI / 2, 0, 5).slice(1));
    o.push([x + w, y + h - r]); o.push(...circ(x + w - r, y + h - r, r, r, 0, Math.PI / 2, 5).slice(1));
    o.push([x + r, y + h]); o.push(...circ(x + r, y + h - r, r, r, Math.PI / 2, Math.PI, 5).slice(1));
    o.push([x, y + r]); o.push(...circ(x + r, y + r, r, r, Math.PI, Math.PI * 1.5, 5).slice(1));
    o.push([x + r + 6, y - 1]); return o;
  };
  const head = (P, len = 20, spread = 0.5) => {
    const a = P[P.length - 1], b = P[Math.max(0, P.length - 4)], an = Math.atan2(a[1] - b[1], a[0] - b[0]);
    return [[a[0] - Math.cos(an - spread) * len, a[1] - Math.sin(an - spread) * len], a, [a[0] - Math.cos(an + spread) * len, a[1] - Math.sin(an + spread) * len]];
  };

  // ================= the story: "Why the sky is blue" =================
  // Palette (marker colors): ink, blue, red, green, orange, yellow, violet
  const COLS = { ink: '#1d1f26', blue: '#1f4fc2', red: '#d4262f', green: '#16884a', orange: '#e0761c', yellow: '#c9970f', violet: '#7040b8' };
  const FONTF = { title: '"Permanent Marker"', label: '"Kalam"', num: '"Permanent Marker"' };
  const FONTW = { title: 400, label: 700, num: 400 };

  // >>>CONTENT-META: DURATION = last word end + ~1 s (taken from WORDS.tsv)
  const DURATION = 31.6;
  // <<<CONTENT-META

  // >>>CONTENT-VISUAL (story-specific: every drawn stroke/text with its a..b times, read from WORDS.tsv)
  const ITEMS = (() => {
    const items = [];
    let auto = 100;
    const line = (pts, role, w, a, b, opt = {}) => items.push({ k: 'line', pts, role, w, a, b, amp: opt.amp ?? 1.5, step: opt.step, seed: auto++ });
    const text = (s, x, y, size, font, role, a, b, opt = {}) => items.push({ k: 'text', s, x, y, size, font, role, a, b, rot: opt.rot || 0, align: opt.align || 'left', seed: auto++ });
    const dot = (x, y, r, role, a) => items.push({ k: 'dot', x, y, r, role, a, b: a + 0.05 });
    const arrow = (pts, role, w, a, b, hl = 22) => {
      line(pts, role, w, a, b);
      line(head(pts, hl), role, w, b, b + 0.1);
    };
    const molecule = (x, y, a, role = 'ink', s = 1) => {
      const r = H.rng('mol' + ((x * 7 + y * 13) | 0));
      const o1 = r.range(-0.7, 0.7), o2 = r.range(-0.7, 0.7);
      line(circ(x - 11 * s, y + o1, 8 * s, 8 * s, -1.3 + o1, -1.3 + o1 + 6.9), role, 3.4, a, a + 0.1);
      line(circ(x + 11 * s, y + o2, 8 * s, 8 * s, 0.4 + o2, 0.4 + o2 + 6.9), role, 3.4, a + 0.05, a + 0.15);
      line([[x - 4, y + o1 * 0.5], [x + 4, y + o2 * 0.5]], role, 3, a + 0.1, a + 0.17);
    };
    const sun = (x, y, r, role, a0, per, angles) => {
      line(circ(x, y, r, r, -1.6, 5.2), role, 6, a0, a0 + per * 0.5);
      const n = angles.length;
      angles.forEach((an, i) => {
        const c = Math.cos(an), s = Math.sin(an);
        line([[x + c * (r + 7), y + s * (r + 7)], [x + c * (r + 26), y + s * (r + 26)]], role, 5, a0 + per * (0.5 + 0.5 * i / n), a0 + per * (0.5 + 0.5 * (i + 1) / n));
      });
    };
    const eye = (x, y, a) => {
      line(bez([x - 46, y], [x - 16, y - 30], [x + 16, y - 30], [x + 46, y]), 'ink', 6, a, a + 0.25);
      line(bez([x + 46, y], [x + 16, y + 24], [x - 16, y + 24], [x - 46, y]), 'ink', 6, a + 0.2, a + 0.45);
      line(circ(x, y - 3, 9, 9), 'ink', 5, a + 0.4, a + 0.55);
    };
    const scribble = (x0, y0, x1, y1, role, a0, a1, n, seedStr, wLo, wHi) => {
      const r = H.rng(seedStr);
      for (let i = 0; i < n; i++) {
        const y = y0 + (y1 - y0) * (i + 0.35) / n + r.range(-4, 4);
        const xs = x0 + r.range(0, 60), xe = x1 - r.range(0, 60);
        line([[xs, y], [(xs + xe) / 2, y + r.range(-14, 14)], [xe, y + r.range(-10, 10)]], role, r.range(wLo, wHi),
          a0 + (a1 - a0) * i / n, a0 + (a1 - a0) * (i + 1) / n + 0.05, { amp: 2.4, step: 8 });
      }
    };

    // ---------- BEAT 1 · 0.0–4.0 · hook: blue sky vs red sunset ----------
    text('WHY IS THE SKY BLUE?', 640, 292, 74, 'title', 'ink', 0.05, 0.9, { align: 'center', rot: -0.012 });
    line([[300, 326], [640, 318], [980, 314]], 'blue', 8, 0.85, 1.1);           // underline lands with the word "blue" (0.80)
    line(rrect(185, 385, 405, 265, 26), 'blue', 7, 1.15, 1.45);                 // day-sky panel
    line(rrect(190, 380, 397, 258, 24).map(([x, y]) => [x + 4, y - 3]), 'blue', 5, 1.45, 1.65);
    text('blue', 385, 462, 42, 'label', 'blue', 1.55, 1.85, { align: 'center' });
    sun(385, 555, 30, 'ink', 1.9, 0.45, [-2.9, -2.2, -1.5, -0.8, -0.15]);       // high sun
    line([[250, 614], [380, 600], [520, 610]], 'blue', 12, 2.4, 2.75, { amp: 2.5 }); // blue sky wash
    text('=', 660, 522, 64, 'title', 'ink', 2.3, 2.45, { align: 'center' });    // "same reason" (1.64–2.32)
    line(rrect(735, 385, 405, 265, 26), 'red', 7, 2.5, 2.8);                    // sunset panel ("sunset" 2.54)
    line(rrect(740, 380, 397, 258, 24).map(([x, y]) => [x + 4, y - 3]), 'red', 5, 2.8, 3.0);

// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).

          tone(tb, { f: [[0, 110], [0.1, 50]], dur: 0.18, gain: (b % 2 ? 0.16 : 0.26) * g, bus: 'music' });
          noise(tb + beat / 2, { dur: 0.04, filter: 'highpass', f: 7000, gain: 0.05 * g, bus: 'music' });
          tone(tb + beat / 2, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.08 * g, bus: 'music' });
        }
        if (name === 'chip') for (let s = 0; s < 8 && t + s * beat / 2 < t1 - 0.05; s++) {
          const ts = t + s * beat / 2;
          tone(ts, { f: hz(ch[0]) / 2, type: 'triangle', dur: beat * 0.45, gain: 0.12 * g, a: 0.001, hold: beat * 0.35, bus: 'music' });
          tone(ts, { f: ch[[0, 1, 2, 3, 2, 1, 2, 3][s]], type: 'square', dur: beat * 0.4, gain: 0.03 * g, a: 0.001, hold: beat * 0.25, bus: 'music' });
        }
      }
    }

    return { play, bed, music, tone, noise, withMinor, hz, vo: VO, sounds: Object.keys(S) };
  };

  // Live playback for a player: SOUND.live(scoreFn, fromT, { voiceover, master }) starts the score from explainer time
  // fromT right now and returns stop(). Call stop() on pause or seek, and SOUND.live again on play.
  SOUND.live = function (fn, fromT, opts) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    fn(SOUND.kit(ctx, Object.assign({}, opts, { start: fromT || 0, delay: 0.03 })));
    return () => { try { ctx.close(); } catch (e) {} };
  };

  // Render a style's explainerSound into an OfflineAudioContext; returns interleaved float stereo.
  SOUND.renderOffline = async function (fn, duration, sampleRate, kitOpts) {
    const sr = sampleRate || 48000, len = Math.ceil(duration * sr);
    const ctx = new OfflineAudioContext(2, len, sr);
    fn(SOUND.kit(ctx, kitOpts || {}));
    const buf = await ctx.startRendering();
    const L = buf.getChannelData(0), R = buf.getChannelData(1), inter = new Float32Array(len * 2);
    let peak = 0;
    for (let i = 0; i < len; i++) { inter[2 * i] = L[i]; inter[2 * i + 1] = R[i]; peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i])); }
    return { inter, peak, frames: len, sr };
  };
})();


// ================= sound score: "Why the sky is blue" =================
// One marker stroke per drawn stroke (felt-tip touchdown + stroke), per-word strokes under
// mText writes, whooshes on the three camera moves, and the big hits (the 10x number, the red
// ray reaching the eye, "Unfiltered.") at full volume on stressed words / in pauses.
window.scoreSound = function (k) {
  const D = window.SB_DURATION;
  const P = (x) => Math.max(-0.85, Math.min(0.85, (x - 2500) / 2400));
  k.play('pop', 0.03, { f: 330, gain: 0.45, minor: true }); // cap off

  for (const it of window.SB_ITEMS) {
    if (it.k === 'line') {
      const x0 = it.pts[0][0], x1 = it.pts[it.pts.length - 1][0];
      k.noise(it.a, { dur: 0.022, filter: 'bandpass', f: 1500, q: 1.4, gain: 0.2, a: 0.001, pan: P(x1), minor: true }); // tip touches down
      k.play('stroke', it.a, { material: 'marker', dur: Math.max(0.08, it.b - it.a), gain: 0.9, pan: P((x0 + x1) / 2), minor: true });
    } else if (it.k === 'dot') {
      k.play('tick', it.a, { gain: 0.6, minor: true });
    } else {
      const n = it.s.length; let m; const re = /\S+/g;
      while ((m = re.exec(it.s))) k.play('stroke', it.a + (it.b - it.a) * m.index / n, { material: 'marker', dur: Math.max(0.06, (it.b - it.a) * m[0].length / n), gain: 0.75, pan: P(it.x), minor: true });
      k.play('pop', it.b, { f: 420 + it.size * 4, gain: 0.5, pan: P(it.x), minor: true });
    }
  }

  // >>>CONTENT-SOUND (story-specific accents; the generic per-item strokes above stay fixed)
  // camera pans / zooms across the board
  [[3.85, 4.7], [8.0, 8.45], [13.0, 13.85], [17.9, 18.75]].forEach(([a, b]) => k.play('whoosh', a, { dur: b - a, top: 2200, gain: 0.85 }));
  // the rainbow fans out
  k.play('sparkle', 6.85, { n: 8, gain: 0.8, minor: true });
  // each long blue scatter arrow gets a tick; each deflecting arrow a swish
  [11.35, 11.55, 11.75, 11.95, 12.15].forEach((t) => k.play('tick', t, { f: 3600, gain: 0.7, minor: true }));
  [23.0, 23.42, 23.84, 24.26].forEach((t) => k.play('swish', t, { gain: 0.8, minor: true }));
  // the key number lands (on the stressed word "ten", 20.37)
  k.play('impact', 20.42, { gain: 0.9 });
  k.play('ding', 20.44, { f: 'E6', gain: 0.5 });
  // the red ray reaches the eye
  k.play('success', 27.4, { gain: 0.85 });
  // takeaway: "Unfiltered." lands big, final ding on the underline
  k.play('impact', 29.98, { gain: 0.95 });
  k.play('success', 31.12, { f: 'G5', gain: 0.7 });
  // <<<CONTENT-SOUND
};

// ================= player =================
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const DUR = window.SB_DURATION;
  const $ = (id) => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), timeEl = $('time'), sndBtn = $('snd'),
    loopEl = $('loop'), loadBtn = $('load'), fileEl = $('file'), voEl = $('vo'), hintEl = $('hint');

  let au = null, soundOn = true, playing = false, stopFx = null, clockT = 0, rafPrev = 0, dragging = false, lastDrawn = -1;

  const fmt = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  const currentT = () => (au ? au.currentTime : clockT);
  const draw = (t) => window.SB_drawFrame(ctx, 1280, 720, t);

  function fit() {
    const st = document.getElementById('stage'), r = st.getBoundingClientRect();
    const s = Math.min(r.width / 1280, r.height / 720) * 0.98;
    cv.style.width = Math.round(1280 * s) + 'px'; cv.style.height = Math.round(720 * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  scrub.max = String(DUR); // duration is story-specific

  function startFx() {
    if (!soundOn) return;
    if (stopFx) stopFx();
    stopFx = window.SOUND.live(window.scoreSound, currentT(), { voiceover: true });
  }
  function stopFxNow() { if (stopFx) { stopFx(); stopFx = null; } }

  function syncUI(t) {
    if (!dragging) scrub.value = t;
    timeEl.textContent = fmt(t) + ' / ' + fmt(DUR);
  }

  function play() {
    playing = true;
    if (au) { if (au.currentTime >= DUR - 0.02) au.currentTime = 0; au.muted = !soundOn; au.play(); }
    else if (clockT >= DUR - 0.02) clockT = 0;
    startFx();
    playBtn.textContent = '⏸ Pause';
  }
  function pause() {
    playing = false;
    if (au) au.pause();
    stopFxNow();
    playBtn.textContent = '▶ Play';
  }
  playBtn.onclick = () => (playing ? pause() : play());

  function seek(t) {
    t = Math.max(0, Math.min(DUR, t));
    if (au) au.currentTime = t; else clockT = t;
    lastDrawn = -1; syncUI(t);
  }
  window.seek = (t) => { seek(t); draw(Math.max(0, Math.min(DUR, t))); };

  scrub.addEventListener('pointerdown', () => (dragging = true));
  scrub.addEventListener('pointerup', () => (dragging = false));
  scrub.addEventListener('input', () => { // live preview while dragging
    const t = parseFloat(scrub.value);
    if (au) au.currentTime = t; else clockT = t;
    lastDrawn = -1; syncUI(t);
  });
  scrub.addEventListener('change', () => { if (playing) startFx(); });

  sndBtn.onclick = () => {
    soundOn = !soundOn;
    if (!soundOn) { stopFxNow(); if (au) au.muted = true; }
    else { if (au) au.muted = false; if (playing) startFx(); }
    sndBtn.textContent = soundOn ? '🔊 sound on' : '🔇 sound off';
  };

  function loadVO(f) {
    if (!f) return;
    stopFxNow();
    if (au) { au.pause(); }
    au = new Audio(URL.createObjectURL(f));
    au.preload = 'auto';
    au.muted = !soundOn;
    voEl.textContent = '♪ ' + f.name;
    hintEl.style.opacity = '0';
    if (playing) au.play().then(startFx);
  }
  loadBtn.onclick = () => fileEl.click();
  fileEl.onchange = () => loadVO(fileEl.files[0]);
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
  window.addEventListener('dragleave', (e) => { if (e.relatedTarget == null) document.body.classList.remove('drag'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); document.body.classList.remove('drag');
    const f = [...e.dataTransfer.files].find((f) => f.type.startsWith('audio') || /\.(wav|mp3|m4a|ogg|aac)$/i.test(f.name));
    if (f) loadVO(f);
  });

  // keyboard: space = play/pause, arrows = +/- 1s
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') seek(currentT() + 1);
    if (e.code === 'ArrowLeft') seek(currentT() - 1);
  });

  function loop(now) {
    if (window.__renderMode) { requestAnimationFrame(loop); return; } // frame-by-frame renderer drives the canvas
    const dt = Math.min(0.1, (now - rafPrev) / 1000); rafPrev = now;
    if (playing) {
      if (au) {
        if (au.currentTime >= DUR - 0.005) {
          if (loopEl.checked) { au.currentTime = 0; au.play(); startFx(); } else pause();
        }
      } else {
        clockT += dt;
        if (clockT >= DUR) {
          if (loopEl.checked) { clockT = 0; startFx(); } else { clockT = DUR; pause(); }
        }
      }
    }
    const t = currentT();
    if (Math.abs(t - lastDrawn) > 0.0005) { draw(Math.max(0, Math.min(DUR, t))); lastDrawn = t; }
    syncUI(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame((n) => { rafPrev = n; requestAnimationFrame(loop); });

  // fonts first, then bake the board ghost with a first frame
  Promise.all(['400 66px "Permanent Marker"', '700 38px "Kalam"', '400 40px "Permanent Marker"']
    .map((f) => document.fonts.load(f, 'AaZz09!×?')))
    .then(() => document.fonts.ready)
    .then(() => { draw(0); lastDrawn = 0; window.__ready = true; });
})();

</script>
