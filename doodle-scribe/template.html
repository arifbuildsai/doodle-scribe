<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Why Doodle Videos Work — Doodle Scribe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Anton&family=Permanent+Marker&display=block">
<style>
  html, body { margin: 0; height: 100%; background: #f2f3f5; color: #23262b; font-family: "Kalam", cursive; overflow: hidden; }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #stage { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #cv { background: #ffffff; border-radius: 6px; box-shadow: 0 6px 30px rgba(0,0,0,.25); }
  #bar { display: flex; gap: 10px; align-items: center; padding: 9px 14px; background: #ffffff; border-top: 1px solid #e3e5e8; flex-wrap: wrap; }
  #bar button, #bar label.btn { background: #fff; color: #23262b; border: 1px solid #cfd3d9; border-radius: 7px; padding: 6px 12px; font-family: "Kalam", cursive; font-size: 15px; cursor: pointer; user-select: none; }
  #bar button:hover, #bar label.btn:hover { background: #f0f1f3; }
  #scrub { flex: 1; min-width: 160px; accent-color: #8b3fd1; }
  #time { font-size: 14px; color: #6a6f77; min-width: 118px; text-align: center; }
  #vo { font-size: 13.5px; color: #3d8a4f; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); font-size: 14px; color: #6a6f77; background: rgba(255,255,255,.9); border: 1px solid #e3e5e8; padding: 5px 14px; border-radius: 8px; pointer-events: none; transition: opacity .4s; }
  #drop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(240,240,242,.85); font-family: "Anton", sans-serif; font-size: 34px; color: #8b3fd1; pointer-events: none; }
  body.drag #drop { display: flex; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div>
  <div id="bar">
    <button id="play">▶ Play</button>
    <input id="scrub" type="range" min="0" max="27" step="0.01" value="0">
    <span id="time">0:00.0 / 0:27.0</span>
    <button id="snd">🔊 sound on</button>
    <label class="btn"><input id="loop" type="checkbox" checked> loop</label>
    <input id="file" type="file" accept="audio/*" hidden>
    <button id="load">⬆ Load voiceover</button>
    <span id="vo">vo/VO.wav</span>
  </div>
</div>
<div id="hint">Drop a voiceover file anywhere to re-sync — the audio becomes the clock.</div>
<div id="drop">drop the audio file anywhere</div>

<script src="assets/strokes.js"></script>
<script>
// ================= H helper library (unchanged) =================
(function () {
  const H = (window.H = {});
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    return { n2, n3 };
  };
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    ctx.putImageData(img, 0, 0);
  };
})();

// ================= SOUND kit (unchanged, inlined) =================
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },
      impact: (t, o) => { S.thud(t, o); noise(t, { dur: 0.7, color: 'pink', filter: 'lowpass', f: [[0, 2400], [0.6, 300]], gain: 0.3 * o.g, verb: 0.35, pan: o.pan }); },
      stamp: (t, o) => { S.thud(t, { ...o, f: 160 }); noise(t, { dur: 0.05, filter: 'bandpass', f: 1300, q: 1.2, gain: 0.4 * o.g, pan: o.pan }); noise(t + 0.004, { dur: 0.012, filter: 'highpass', f: 3500, gain: 0.25 * o.g, pan: o.pan }); },
      ding: (t, o) => { const f = hz(o.f || 'E6'); tone(t, { f, dur: 1.3, gain: 0.2 * o.g, verb: 0.3, pan: o.pan }); tone(t, { f: f * 2.76, dur: 0.5, gain: 0.05 * o.g, verb: 0.3, pan: o.pan }); },
      success: (t, o) => { S.ding(t, { ...o, f: o.f || 'C6' }); S.ding(t + 0.09, { ...o, f: hz(o.f || 'C6') * 1.5, g: o.g * 0.9 }); },
      error: (t, o) => { tone(t, { f: o.f || 'A3', type: 'square', dur: 0.13, gain: 0.09 * o.g, hold: 0.08, filter: 'lowpass', f2: 1400, pan: o.pan }); tone(t + 0.15, { f: hz(o.f || 'A3') * 0.8, type: 'square', dur: 0.22, gain: 0.09 * o.g, hold: 0.14, filter: 'lowpass', f2: 1200, pan: o.pan }); },
      buzz: (t, o) => { const d = o.dur || 0.3; tone(t, { f: o.f || 110, type: 'sawtooth', dur: d, gain: 0.12 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); tone(t, { f: (o.f || 110) * 1.01, type: 'sawtooth', dur: d, gain: 0.1 * o.g, hold: d * 0.7, filter: 'lowpass', f2: 900, pan: o.pan }); },
      sparkle: (t, o) => { const r = rand('sparkle' + t), notes = ['C6', 'D6', 'E6', 'G6', 'A6', 'C7']; for (let i = 0; i < (o.n || 6); i++) { const ti = t + i * 0.04 + r() * 0.01, f = hz(notes[Math.floor(r() * notes.length)]), pan = r() * 1.2 - 0.6; tone(ti, { f, dur: 0.6, gain: 0.04 * o.g, a: 0.002, verb: 0.35, pan }); tone(ti, { f: f * 2.76, dur: 0.2, gain: 0.012 * o.g, a: 0.002, pan }); } },
      glitch: (t, o) => { const r = rand('glitch' + t); for (let i = 0; i < 7; i++) tone(t + i * 0.022, { f: 200 + r() * 1800, type: 'square', dur: 0.02, gain: 0.07 * o.g, a: 0.001, hold: 0.015, pan: r() * 1.4 - 0.7 }); noise(t, { dur: 0.16, filter: 'bandpass', f: 2500, q: 0.6, gain: 0.12 * o.g }); },
      shutter: (t, o) => { S.click(t, o); noise(t + 0.06, { dur: 0.04, filter: 'bandpass', f: 2200, q: 1, gain: 0.2 * o.g, pan: o.pan }); },
      count: (t, o) => S.tick(t, { ...o, f: o.f || 5200, g: o.g * 0.7 }),

      // hand-made media
      // stroke: a pen/marker/chalk/pencil stroke over `dur` seconds. material sets the surface sound.
      stroke: (t, o) => {
        const d = o.dur || 0.4, m = o.material || 'marker', r = rand('stroke' + m + t);
        const M = {
          marker: { f: 2900, q: 2.2, g: 0.16, grain: 0.05 },
          chalk: { f: 1700, q: 0.6, g: 0.22, grain: 0.028 },
          pencil: { f: 4600, q: 0.8, g: 0.16, grain: 0.04, filter: 'highpass' },
          pen: { f: 4200, q: 1.6, g: 0.08, grain: 0.06 },
          brush: { f: 900, q: 0.5, g: 0.1, grain: 0.09, color: 'pink' },
          sharpie: { f: 2400, q: 1.4, g: 0.2, grain: 0.045 },
        }[m];
        for (let x = 0; x < d; x += M.grain * (0.7 + r() * 0.6)) {
          const gd = M.grain * (0.8 + r() * 0.9);
          noise(t + x, { dur: gd, color: M.color, filter: M.filter || 'bandpass', f: M.f * (0.8 + r() * 0.4), q: M.q, gain: M.g * o.g * (0.6 + r() * 0.5), a: gd * 0.3, pan: (o.pan || 0) + (r() - 0.5) * 0.2 });
        }
      },
      // paper: picking up / slapping down / turning a sheet
      paper: (t, o) => { const d = o.dur || 0.35, r = rand('paper' + t); for (let x = 0; x < d; x += 0.025 + r() * 0.03) noise(t + x, { dur: 0.05, filter: 'bandpass', f: 1200 + r() * 2600, q: 0.9, gain: 0.12 * o.g * (1 - x / d * 0.5), pan: o.pan }); },
      slap: (t, o) => { noise(t, { dur: 0.07, filter: 'highpass', f: 900, gain: 0.45 * o.g, a: 0.001, pan: o.pan }); tone(t, { f: [[0, 180], [0.06, 70]], dur: 0.1, gain: 0.25 * o.g, pan: o.pan }); },
      tape: (t, o) => { noise(t, { dur: o.dur || 0.5, filter: 'bandpass', f: [[0, 900], [o.dur || 0.5, 2200]], q: 1.8, gain: 0.18 * o.g, a: 0.02, pan: o.pan }); },
      press: (t, o) => { S.thud(t, { ...o, f: 95, g: o.g * 0.9 }); noise(t + 0.01, { dur: 0.25, color: 'brown', filter: 'lowpass', f: 700, gain: 0.25 * o.g, pan: o.pan }); },
      roller: (t, o) => { const d = o.dur || 0.6; noise(t, { dur: d, color: 'brown', filter: 'bandpass', f: 380, q: 1.5, gain: 0.3 * o.g, a: 0.05, hold: d * 0.6, pan: o.pan }); for (let x = 0; x < d; x += 0.07) S.tock(t + x, { f: 300, g: o.g * 0.15, pan: o.pan }); },

// ================= pen / doodle drawing technique =================
(function () {
  const seg = (pts, step = 2.5) => {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1];
      const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / step));
      for (let j = 0; j < n; j++) out.push([x0 + (x1 - x0) * j / n, y0 + (y1 - y0) * j / n]);
    }
    out.push(pts[pts.length - 1]);
    return out;
  };
  const normals = (P) => P.map((p, i) => {
    const a = P[Math.max(0, i - 1)], b = P[Math.min(P.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    return [-dy / d, dx / d];
  });
  const wobble = (pts, nz, seed, amp = 1.6, freq = 0.011) => {
    const N = normals(pts); let L = 0;
    return pts.map((p, i) => {

    n = n || Math.max(12, Math.ceil(Math.abs(a1 - a0) * Math.max(rx, ry) / 6)); const o = [];
    for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; o.push([x + Math.cos(a) * rx, y + Math.sin(a) * ry]); }
    return o;

    const out = [];
    for (let i = 0; i <= 60; i++) {
      const t = i / 60, m = 1 - t;
      out.push([m * m * m * p0[0] + 3 * m * m * t * p1[0] + 3 * m * t * t * p2[0] + t * t * t * p3[0],

  };

  const PN = H.makeNoise(777);
  const pen = (ctx, pts, col, w, seed, prog = 1) => {
    if (prog <= 0) return;
    const P = prog < 1 ? pts.slice(0, Math.max(2, Math.ceil(pts.length * prog))) : pts;

      ctx.stroke();

    const n = 5;
    for (let k = 0; k < n; k++) {
      const u = k / (n - 1) - 0.5, edge = Math.abs(u) * 2;
      const a = (0.06 + 0.45 * Math.pow(edge, 2.2)) * (0.6 + r() * 0.7);

      ctx.stroke();
    }
    for (let k = 0; k < 3; k++) {

  };

    if (prog <= 0) return;

    ctx.translate(x, y); ctx.rotate(rot);
    const nChars = Math.ceil(str.length * prog);

      const ch = str[i], wch = ctx.measureText(ch).width;
      ctx.save(); ctx.translate(cx + wch / 2, (r() - 0.5) * 2.4); ctx.rotate((r() - 0.5) * 0.05);

      ctx.restore();
      cx += wch + (r() - 0.5) * 1.2;
    }
    ctx.restore();
  };

  // Big outlined display text, letter by letter (the "EFFICIENT" look).
  const oText = (ctx, str, x, y, size, col, seed, prog = 1, rot = 0, align = 'center') => {
    if (prog <= 0) return;
    ctx.save(); ctx.font = `400 ${size}px "Anton"`; ctx.textBaseline = 'alphabetic';
    const total = ctx.measureText(str).width;
    let x0 = x; if (align === 'center') x0 = x - total / 2; else if (align === 'right') x0 = x - total;
    ctx.translate(x0, y); ctx.rotate(rot);
    const r = H.rng(seed);
    const nChars = Math.max(1, Math.ceil(str.length * prog));
    let cx = 0;
    ctx.lineWidth = Math.max(2.5, size * 0.05); ctx.lineJoin = 'round';
    for (let i = 0; i < nChars; i++) {
      const ch = str[i], wch = ctx.measureText(ch).width;
      ctx.save(); ctx.translate(cx + wch / 2, (r() - 0.5) * 1.5); ctx.rotate((r() - 0.5) * 0.02);
      ctx.strokeStyle = H.rgba(col, 0.95); ctx.fillStyle = '#ffffff';
      ctx.strokeText(ch, -wch / 2, 0); ctx.fillText(ch, -wch / 2, 0);
      ctx.restore();
      cx += wch + size * 0.015;
    }
    ctx.restore();
  };

  window.DS = { seg, normals, wobble, circ, bez, tracePath, head, pen, mText, oText };
})();

        const p = win(t, it.a, it.b);
        if (tip && p < 1) handAt = tip;
      } else if (it.k === 'svg') {
        // SVG line art drawn in true stroke order — the hand rides the ink front
        drawSvgWhiteout(ctx, it, t);
        const tip = drawSvg(ctx, it, t);
        if (tip) handAt = tip;
      } else if (it.k === 'line') {
        const p = win(t, it.a, it.b);
        if (p <= 0) continue;
        const P = wobble(seg(it.pts, it.step || 2.5), nz, it.seed % 97, it.amp);
        pen(ctx, P, COLS[it.role], it.w, it.seed, p);
        // the hand draws the lines too — but ONLY while this stroke is actively mid-draw,
        // otherwise a finished stroke (a dot, an earlier line) parks the hand at its end point
        if (p < 1) {
          const k = Math.min(P.length - 1, Math.floor(p * (P.length - 1) + 1e-6));
          handAt = { x: P[Math.min(P.length - 1, k + 1)][0], y: P[Math.min(P.length - 1, k + 1)][1] };
        }
      } else if (it.k === 'text') {
        const p = win(t, it.a, it.b);
        if (p <= 0) continue;
        const font = `700 ${it.size}px "Kalam"`;
        ctx.save(); ctx.font = font; const w = ctx.measureText(it.s).width; ctx.restore();
        const x0 = it.align === 'center' ? it.x - w / 2 : it.x;
        mText(ctx, it.s, x0, it.y, font, COLS[it.role], it.seed % 991, p, it.rot);
      } else if (it.k === 'oword') {
        const p = win(t, it.a, it.b);
        if (p <= 0) continue;
        oText(ctx, it.s, it.x, it.y, it.size, COLS[it.role], it.seed % 991, p, it.rot, it.align);
      }
    }

    if (handAt && handCv) {
      // fixed hand angle — the hand never rotates or mirrors; it only hops between strokes.
      // a slight clockwise tilt drops the hand body a little below the tip, like a real drawing hand.
      const s = HAND_LEN / handCv.width;
      ctx.save();
      ctx.translate(handAt.x, handAt.y); ctx.rotate(HAND_ROT);
      ctx.drawImage(handCv, -HAND_TIP[0] * HAND_LEN, -HAND_TIP[1] * HAND_LEN, HAND_LEN, handCv.height * s);
      ctx.restore();
    }

    H.grain(ctx, W, Hh, 0.012, 9 + (Math.floor(t * 12) % 5));
  };

  const loadAll = async () => {
    await Promise.all(Object.keys(ASSETS).map((n) => new Promise((res) => {
      const im = new Image(); im.onload = () => { IMGS[n] = keyLineArt(im); res(); }; im.onerror = () => res();
      im.src = ASSETS[n];
    })));
    handCv = await (async () => {
      for (const src of HAND_SRC_CANDIDATES) {
        const im = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; });
        if (im) {
          const conf = HAND_CONF[src] || { tip: [0.19, 0.6], rot: 0, len: 300 };
          HAND_TIP = conf.tip; HAND_ROT = conf.rot; HAND_LEN = conf.len;
          return keyHand(im);
        }
      }
      return null;
    })();
    for (const it of ITEMS) if (it.k === 'scribe') buildScribe(it);
    for (const it of ITEMS) if (it.k === 'svg') buildSvg(it);
  };
  window.DS_load = loadAll;
  window.DS_ITEMS = ITEMS;
  window.DS_DURATION = DURATION;
  window.DS_CUTS = CUTS;
})();
window.DURATION = window.DS_DURATION;

// ================= sound score: pencil on paper =================
// >>>CONTENT-SOUND
window.scoreSound = function (k) {
  const P = (x) => Math.max(-0.85, Math.min(0.85, (x - 640) / 900));
  k.play('pop', 0.03, { f: 520, gain: 0.4, minor: true }); // pen cap off
  (window.DS_CUTS || []).forEach((t) => k.play('paper', t, { gain: 0.5, minor: true })); // page flip on every cut

  for (const it of window.DS_ITEMS || []) {
    if (it.k === 'scribe') {
      k.play('stroke', it.a, { material: 'pencil', dur: Math.max(0.15, it.b - it.a), gain: 0.8, pan: P(it.x + it.w / 2), minor: true });
      k.play('pop', it.b, { f: 420 + it.w * 0.4, gain: 0.45, pan: P(it.x + it.w / 2), minor: true });
    } else if (it.k === 'svg') {
      // SVG stroke-order drawing: pencil sound across the whole drawing + pop on completion
      k.play('stroke', it.a, { material: 'pencil', dur: Math.max(0.15, it.b - it.a), gain: 0.8, pan: P(it.x + it.w / 2), minor: true });
      k.play('pop', it.b, { f: 420 + it.w * 0.4, gain: 0.45, pan: P(it.x + it.w / 2), minor: true });
    } else if (it.k === 'line') {
      k.play('stroke', it.a, { material: 'pen', dur: Math.max(0.08, it.b - it.a), gain: 0.7, pan: P(it.pts[0][0]), minor: true });
    } else {
      const n = (it.s || '').length, re = /\S+/g; let m;
      if (!n) continue;
      while ((m = re.exec(it.s))) k.play('stroke', it.a + (it.b - it.a) * m.index / n, { material: 'pencil', dur: Math.max(0.06, (it.b - it.a) * m[0].length / n), gain: 0.7, pan: P(it.x), minor: true });
      k.play('pop', it.b, { f: 400 + it.size * 4, gain: 0.5, pan: P(it.x), minor: true });
    }
  }

  k.play('impact', 23.37, { gain: 0.85 });               // "DOODLES STICK." lands
  k.play('sparkle', 23.5, { n: 6, gain: 0.7, minor: true });
  k.play('click', 26.4, { f: 1300, gain: 0.8, minor: true }); // cap back on
};
// <<<CONTENT-SOUND
</script>

<script>
// ================= player (same harness as the whiteboard profile) =================
(function () {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  const DUR = window.DS_DURATION;
  const $ = (id) => document.getElementById(id);
  const playBtn = $('play'), scrub = $('scrub'), timeEl = $('time'), sndBtn = $('snd'),
    loopEl = $('loop'), loadBtn = $('load'), fileEl = $('file'), voEl = $('vo'), hintEl = $('hint');

  let au = null, soundOn = true, playing = false, stopFx = null, clockT = 0, rafPrev = 0, dragging = false, lastDrawn = -1;

  const fmt = (t) => Math.floor(t / 60) + ':' + (t % 60).toFixed(1).padStart(4, '0');
  const currentT = () => (au ? au.currentTime : clockT);
  const draw = (t) => window.DS_drawFrame(ctx, 1280, 720, t);

  function fit() {
    const st = document.getElementById('stage'), r = st.getBoundingClientRect();
    const s = Math.min(r.width / 1280, r.height / 720) * 0.98;
    cv.style.width = Math.round(1280 * s) + 'px'; cv.style.height = Math.round(720 * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();
  scrub.max = String(DUR);

  function startFx() {
    if (!soundOn) return;
    if (stopFx) stopFx();
    stopFx = window.SOUND.live(window.scoreSound, currentT(), { voiceover: true });
  }
  function stopFxNow() { if (stopFx) { stopFx(); stopFx = null; } }

  function syncUI(t) {
    if (!dragging) scrub.value = t;
    timeEl.textContent = fmt(t) + ' / ' + fmt(DUR);
  }

  function play() {
    playing = true;
    if (au) { if (au.currentTime >= DUR - 0.02) au.currentTime = 0; au.muted = !soundOn; au.play(); }
    else if (clockT >= DUR - 0.02) clockT = 0;
    startFx();
    playBtn.textContent = '⏸ Pause';
  }
  function pause() {
    playing = false;
    if (au) au.pause();
    stopFxNow();
    playBtn.textContent = '▶ Play';
  }
  playBtn.onclick = () => (playing ? pause() : play());

  function seek(t) {
    t = Math.max(0, Math.min(DUR, t));
    if (au) au.currentTime = t; else clockT = t;
    lastDrawn = -1; syncUI(t);
  }
  window.seek = (t) => { seek(t); draw(Math.max(0, Math.min(DUR, t))); };

  scrub.addEventListener('pointerdown', () => (dragging = true));
  scrub.addEventListener('pointerup', () => (dragging = false));
  scrub.addEventListener('input', () => {
    const t = parseFloat(scrub.value);
    if (au) au.currentTime = t; else clockT = t;
    lastDrawn = -1; syncUI(t);
  });
  scrub.addEventListener('change', () => { if (playing) startFx(); });

  sndBtn.onclick = () => {
    soundOn = !soundOn;
    if (!soundOn) { stopFxNow(); if (au) au.muted = true; }
    else { if (au) au.muted = false; if (playing) startFx(); }
    sndBtn.textContent = soundOn ? '🔊 sound on' : '🔇 sound off';
  };

  function loadVO(f) {
    if (!f) return;
    stopFxNow();
    if (au) au.pause();
    au = new Audio(URL.createObjectURL(f));
    au.preload = 'auto';
    au.muted = !soundOn;
    voEl.textContent = '♪ ' + f.name;
    hintEl.style.opacity = '0';
    if (playing) au.play().then(startFx);
  }
  loadBtn.onclick = () => fileEl.click();
  fileEl.onchange = () => loadVO(fileEl.files[0]);
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('drag'); });
  window.addEventListener('dragleave', (e) => { if (e.relatedTarget == null) document.body.classList.remove('drag'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault(); document.body.classList.remove('drag');
    const f = [...e.dataTransfer.files].find((f) => f.type.startsWith('audio') || /\.(wav|mp3|m4a|ogg|aac)$/i.test(f.name));
    if (f) loadVO(f);
  });
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    if (e.code === 'ArrowRight') seek(currentT() + 1);
    if (e.code === 'ArrowLeft') seek(currentT() - 1);
  });

  function loop(now) {
    if (window.__renderMode) { requestAnimationFrame(loop); return; }
    const dt = Math.min(0.1, (now - rafPrev) / 1000); rafPrev = now;
    if (playing) {
      if (au) {
        if (au.currentTime >= DUR - 0.005) {
          if (loopEl.checked) { au.currentTime = 0; au.play(); startFx(); } else pause();
        }
      } else {
        clockT += dt;
        if (clockT >= DUR) {
          if (loopEl.checked) { clockT = 0; startFx(); } else { clockT = DUR; pause(); }
        }
      }
    }
    const t = currentT();
    if (Math.abs(t - lastDrawn) > 0.0005) { draw(Math.max(0, Math.min(DUR, t))); lastDrawn = t; }
    syncUI(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame((n) => { rafPrev = n; requestAnimationFrame(loop); });

  Promise.all(['400 96px "Anton"', '700 38px "Kalam"'].map((f) => document.fonts.load(f, 'AaZz09!?')))
    .then(() => document.fonts.ready)
    .then(() => window.DS_load())
    .then(() => { draw(0); lastDrawn = 0; window.__ready = true; });
})();
</script>
</body>
